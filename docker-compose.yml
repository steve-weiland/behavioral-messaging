# Behavioral Messaging Platform — V2 compose.
#
# V2-1 introduces RabbitMQ as the campaign fan-out queue, replacing
# V1's in-process channel. Producer (track-api) publishes per-event
# to the `campaigns.fanout` exchange with routing_key=workspace_id;
# the new campaign-worker (added in V2-1b) consumes per-workspace
# queues with manual-ack semantics.
#
# Host port matrix:
#   track-api       :8090    (container :8080 — 8080 squatted on this dev box)
#   stub-receiver   :8091    (container :8081)
#   MySQL           :3307    (container :3306 — 3306 reserved for "real" local MySQL)
#   RabbitMQ AMQP   :5672    mgmt UI :15672    Prom :15692
#   OTel collector  :4317    (OTLP/gRPC), :8889 (Prom scrape)
#   Tempo           :3200
#   Prometheus      :9090
#   Loki            :3100
#   Grafana         :3030
services:
  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"   # rabbitmq_prometheus plugin (built into 3.13-management)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: bm-root
      MYSQL_DATABASE: bm
      MYSQL_USER: bm
      MYSQL_PASSWORD: bm
    ports:
      - "3307:3306"
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d:ro
    command:
      - --default-authentication-plugin=caching_sha2_password
      - --innodb-buffer-pool-size=256M
      # Headroom for the V2-2 pool bump: 3 services × 50 conns = 150 would
      # sit on top of MySQL's 151 default. 300 leaves comfortable margin.
      - --max-connections=300
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -ubm -pbm --silent || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  tempo:
    image: grafana/tempo:2.10.5
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./deploy/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200"

  loki:
    image: grafana/loki:3.7.1
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./deploy/loki.yaml:/etc/loki/loki.yaml:ro
    ports:
      - "3100:3100"

  alloy:
    image: grafana/alloy:v1.16.1
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    volumes:
      - ./deploy/alloy.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.151.0
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otel-collector.yaml:ro
      - /proc:/hostfs/proc:ro
      - /sys:/hostfs/sys:ro
    ports:
      - "4317:4317"
      - "8889:8889"
    depends_on:
      - tempo
      - mysql

  prometheus:
    image: prom/prometheus:v3.11.3
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
      - "--enable-feature=exemplar-storage"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus-rules.yml:/etc/prometheus/rules.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:13.0.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_FEATURE_TOGGLES_ENABLE: "traceqlEditor"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3030:3000"
    depends_on:
      - tempo
      - prometheus
      - loki

  track-api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: track-api
    environment:
      MYSQL_DSN: "bm:bm@tcp(mysql:3306)/bm?parseTime=true&multiStatements=true"
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_METRICS_EXEMPLAR_FILTER: trace_based
      # No STUB_RECEIVER_URL here: since V2-1b track-api is a producer only —
      # it publishes to campaigns.fanout and never dispatches. The stub URL
      # belongs to campaign-worker, which does the sending.
      SEGMENT_INDEX_URL: http://segment-worker:8083
      MYSQL_MAX_OPEN_CONNS: "${MYSQL_MAX_OPEN_CONNS:-50}"
      PORT: "8080"
    ports:
      - "8090:8080"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started

  stub-receiver:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: stub-receiver
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_METRICS_EXEMPLAR_FILTER: trace_based
      PORT: "8081"
    ports:
      - "8091:8081"
    depends_on:
      otel-collector:
        condition: service_started

  # V2-1b: campaign-worker consumes per-workspace queues bound to
  # campaigns.fanout. One container, configurable AMQP prefetch.
  # Multiple replicas are safe (competing-consumer pattern) but we
  # don't run them yet — V2-1c measures the ceiling first.
  campaign-worker:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: campaign-worker
    environment:
      MYSQL_DSN: "bm:bm@tcp(mysql:3306)/bm?parseTime=true&multiStatements=true"
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_METRICS_EXEMPLAR_FILTER: trace_based
      STUB_RECEIVER_URL: http://stub-receiver:8081
      PREFETCH: "${PREFETCH:-32}"
      CAMPAIGN_HOT_PATH: "${CAMPAIGN_HOT_PATH:-cache}"
      MYSQL_MAX_OPEN_CONNS: "${MYSQL_MAX_OPEN_CONNS:-50}"
      # BM-103: the batching A/B has to be switchable from the host or the
      # measurement isn't reproducible — `CAMPAIGN_BATCH=off make up`.
      CAMPAIGN_BATCH: "${CAMPAIGN_BATCH:-on}"
      BATCH_MAX: "${BATCH_MAX:-64}"
      BATCH_WINDOW: "${BATCH_WINDOW:-10ms}"
      # V3-2 retry ladder; off restores V2's immediate-and-forever requeue.
      RETRY_LADDER: "${RETRY_LADDER:-on}"
      # V3-1a journey enrollment; off is the pure-V2 A/B baseline for BM-140.
      # Must be declared here or `JOURNEYS=off make up` silently does nothing —
      # a mistake this project has now made three times (CAMPAIGN_BATCH, then
      # the journey `then` field, now this).
      JOURNEYS: "${JOURNEYS:-on}"
      PORT: "8082"
    ports:
      - "8092:8082"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started

  # V3-1b: journey-scheduler is the only component that executes journey
  # steps. Claims due runs with FOR UPDATE SKIP LOCKED (so replicas are safe),
  # holds a lease per claim (so a crash mid-step is reclaimable), and gates
  # every send on idempotency_keys (so reclaim can't double-send).
  journey-scheduler:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: journey-scheduler
    environment:
      MYSQL_DSN: "bm:bm@tcp(mysql:3306)/bm?parseTime=true&multiStatements=true"
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_METRICS_EXEMPLAR_FILTER: trace_based
      STUB_RECEIVER_URL: http://stub-receiver:8081
      MYSQL_MAX_OPEN_CONNS: "${MYSQL_MAX_OPEN_CONNS:-50}"
      SCHEDULER_BATCH: "${SCHEDULER_BATCH:-50}"
      # BM-140: bounded parallelism over a claimed batch. 1 reproduces the
      # sequential execution that was the measured V3 ceiling.
      SCHEDULER_CONCURRENCY: "${SCHEDULER_CONCURRENCY:-16}"
      SCHEDULER_LEASE: "${SCHEDULER_LEASE:-30s}"
      SCHEDULER_MAX_SLEEP: "${SCHEDULER_MAX_SLEEP:-5s}"
      # Q16 — a gate row stuck in 'sending' is unknowable; skip never
      # double-sends, retry never under-sends. Pick per message class in prod.
      SEND_GATE_STUCK_POLICY: "${SEND_GATE_STUCK_POLICY:-skip}"
      SEND_GATE_STUCK_AFTER: "${SEND_GATE_STUCK_AFTER:-2m}"
      # BM-131 fair claim; off restores the global ORDER BY wake_at.
      SCHEDULER_FAIR: "${SCHEDULER_FAIR:-on}"
      PORT: "8084"
    ports:
      - "8094:8084"
    depends_on:
      mysql:
        condition: service_healthy
      otel-collector:
        condition: service_started

  # V2-2: segment-worker owns the roaring-bitmap index. Backfills from
  # MySQL at boot, then maintains bitmaps from the event stream
  # (campaigns.fanout) + the people.changes feed. Serves membership over
  # HTTP so track-api's /segments/{id}/check no longer scans MySQL.
  segment-worker:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: segment-worker
    environment:
      MYSQL_DSN: "bm:bm@tcp(mysql:3306)/bm?parseTime=true&multiStatements=true"
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_METRICS_EXEMPLAR_FILTER: trace_based
      PREFETCH: "${SEGMENT_PREFETCH:-32}"
      PORT: "8083"
    ports:
      - "8093:8083"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
