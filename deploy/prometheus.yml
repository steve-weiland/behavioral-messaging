# Prometheus config — scrape the collector's Prometheus exporter only.
# RabbitMQ scrape was carried over from Build 5 but V1 of this stack
# doesn't run RabbitMQ — re-introduce when V2 lands fan-out.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/rules.yml"

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
